name: AniNova
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
targets:
  AniNova:
    type: application
    platform: iOS
    sources:
      - path: AniNova
        excludes: [Resources/Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AniNova
        INFOPLIST_FILE: AniNova/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [AniNovaTests]
  AniNovaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AniNovaTests]
    dependencies: [target: AniNova]

